[project]
name = "mcp-gauntlet"
version = "0.9.5"
description = "A CI linter for what your MCP server publishes: tool poisoning and prompt injection across every surface an agent sees, definition drift between runs, and schema rot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ghaleb Dweikat" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "ci",
    "testing",
    "static-analysis",
    "evals",
    "llm",
    "agents",
    "tool-use",
    "prompt-injection",
    "groq",
    "gemini",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Widened from `<2` once both eras were actually verified, not merely believed to work:
    # every SDK read goes through `adapters/`, the fixtures build on either SDK, and the
    # suite passes under 1.29.0 and 2.0.0 alike. `scripts/era_fixture_probe.py` runs in CI
    # and fails if the two eras ever disagree about the same server.
    #
    # `<3` rather than unbounded, for the reason `<2` was right in the first place: 2.0
    # renamed every field to snake_case, and the old reads did not raise — they returned
    # their defaults, so the checks built on them would have measured nothing and reported
    # every server clean. A major bump is exactly when that happens again, and an unbounded
    # pin would ship it to every fresh install on release day.
    "mcp>=1.9,<3",
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "anyio>=4.4",
    "python-dotenv>=1.0",
    # Imported directly by checks.py; previously only reachable as a transitive dep of
    # `mcp`, so a resolver that dropped it would have broken Schema Health at import time.
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-gauntlet = "mcp_gauntlet.cli:app"

[project.urls]
Homepage = "https://github.com/GhalebDweikat/mcp-gauntlet"
Repository = "https://github.com/GhalebDweikat/mcp-gauntlet"
Issues = "https://github.com/GhalebDweikat/mcp-gauntlet/issues"
Changelog = "https://github.com/GhalebDweikat/mcp-gauntlet/blob/main/CHANGELOG.md"
# No `Leaderboard` link. 0.9.0 deleted the public leaderboard and this URL kept advertising
# it from the PyPI sidebar, 404ing — for a tool whose own README now says it publishes no
# leaderboard. PyPI metadata only refreshes on publish, so a stale link outlives the feature
# by however long the next release takes.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gauntlet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's dependency-injection pattern puts Argument()/Option() calls in defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/HTML template — line length isn't a meaningful constraint here.
"src/mcp_gauntlet/htmlreport.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
