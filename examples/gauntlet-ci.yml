# Example: run mcp-gauntlet against YOUR MCP server on every pull request.
#
# Copy this into your server's repository as `.github/workflows/gauntlet.yml` and change the
# `run:` command to launch your server.
#
# This is a regression suite, not a grader. It fails the build on what it FOUND — a severity
# — rather than on a score. That distinction was learned the hard way:
#
#   * The previous version of this file gated on `--fail-under 60`. A HIGH security finding
#     caps the overall score at 75, and 75 > 60, so NO server with a tool-poisoning finding
#     could ever fail this gate. A platform engineer testing it found the bundled malicious
#     fixture — seven HIGH findings — returning exit 0.
#   * A score threshold also has to be re-baselined whenever scoring changes. One release
#     moved a fixture 14.8 points, so a pinned number quietly meant something different after
#     an upgrade. A severity gate does not drift that way.
name: mcp-gauntlet

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Unpinned, so you track the latest release and pick up new checks as they land. That
      # is the right default for a severity gate: what fails is a finding you can read, not a
      # number that moved. If you need a frozen verdict — an audit trail, a release gate —
      # pin it (`mcp-gauntlet@1.2.3`) and bump deliberately.
      #
      # The command below is a PLACEHOLDER and will fail until you replace it — deliberately.
      # It used to ship pointing at `@modelcontextprotocol/server-everything`, which meant
      # copying this file in unchanged produced a green build gating on somebody else's demo
      # server, with nothing to draw your eye to the line you forgot.
      #
      # NOTE on the interpreter:
      # `uvx` puts its own environment first on PATH, so a bare `python -m your_server` runs
      # under the GAUNTLET's interpreter, which does not have your server's dependencies. Use
      # an absolute path to your venv's python, or a launcher that does not rely on PATH.
      #
      # --fail-on high     tool poisoning, injection markers, hidden characters
      # --fail-on medium   also stdout pollution, weak descriptions, definition drift
      # --fail-on low      also undescribed parameters — a strict hygiene gate
      - name: Run the gauntlet
        run: >
          uvx mcp-gauntlet run "REPLACE-ME-WITH-YOUR-SERVER-COMMAND"
          --no-agentic --fail-on high --out gauntlet-report

      # ── Optional: the full agentic evaluation ────────────────────────────────
      # Add a repository secret with an LLM key (a free Groq key works:
      # https://console.groq.com/keys) and drop --no-agentic so a live agent attempts real
      # tasks against your server.
      #
      # Pass --agentic EXPLICITLY. Without it, a missing, renamed or expired secret — or a
      # fork PR, where secrets are unavailable — silently downgrades to a static run that
      # still exits 0, dropping the heaviest dimension with nothing in the output saying so.
      # `--agentic` turns that into a hard failure instead: exit 4 when no key is configured
      # at all (caught before the run starts), exit 3 when a key IS present but the backend
      # rejects it or errors on every call — a revoked key, an exhausted quota, a bad
      # base-url. Both are non-zero and neither is 1, so a broken key can never be mistaken
      # for your server regressing.
      #
      #   - name: Run the gauntlet (with agent)
      #     env:
      #       GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      #     run: >
      #       uvx mcp-gauntlet run "npx -y your-package"
      #       --agentic --fail-on high --repeats 3 --out gauntlet-report

      - name: Upload report
        if: always() # keep the report even when the gate fails — it says WHAT failed
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-report
          path: gauntlet-report/
# Exit codes, so your pipeline can tell a regression from a bad day:
#
#   0  passed
#   1  GATE FAILED — a real verdict about your server. The only one that should fail a build
#      on quality grounds.
#   2  usage error (a bad flag)
#   3  could not evaluate — the server did not start, timed out, the transport failed, or
#      --agentic was requested and the LLM backend errored on every attempt.
#      Infrastructure, not quality. Treating this as a regression is how a gate earns a
#      reputation for flaking and gets switched off.
#   4  configuration error — the invocation asked for something impossible, e.g. --agentic
#      with no API key configured at all.
#
# To retry infrastructure failures without ever masking a real one, branch on the code rather
# than on pass/fail.
